spring.application.name=ems

# ==============================
# Server Configuration (Cloud providers supply $PORT dynamically)
# ==============================
server.port=${PORT:8080}

# ==============================
# PostgreSQL Database (Inject from Cloud DB like Supabase/Neon/Render)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ems_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:none}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JWT (Keep secret safe via environment variable)
# ==============================
jwt.secret=${JWT_SECRET:ThisIsMyVerySecretKeyForEMSProjectWhichShouldBeAtLeast32CharactersLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================
# JPA / Hibernate (Turn off verbose SQL logs in production)
# ==============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# File Upload
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB